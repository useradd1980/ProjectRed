name: Pneumatic API tests

on:
  push:
    branches:
      - feature/generic-pneumatic-api
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run expansion tests
        run: ./gradlew :expansion:test --console=plain
        env:
          AUTO_GENERATED_VERSION: 5.0-logistics-dev
